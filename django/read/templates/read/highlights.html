{% load static %}

<link rel="stylesheet" href="{% static 'read/style.css' %}">
<script src="{% static 'read/dark.js' %}" defer></script>

<div class="sidebar">
    <h3>Menu</h3>
    <a href="{% url 'index' %}">To read</a>
    <a href="{% url 'archive' %}">Archive</a>
    <a href="{% url 'highlights' %}" class="active">Highlights</a>
    <a href="{% url 'feeds' %}">Feeds</a>
    <a href="{% url 'stats' %}">Stats</a>
    <a href="{% url 'trash' %}">Trash</a>

    <div class="dark-mode-toggle">
        <label class="theme-switch">
            <input type="checkbox" id="dark-mode-toggle">
            <span>Dark Mode</span>
        </label>
    </div>
</div>

<div class="content">

<h1>Highlights</h1>

{% if highlights %}
    <div class="article">
    {% for h in highlights %}
        <blockquote>
            {{ h.content }}
            <br>
            <small><a href="{{ h.text.link }}">{{ h.text.title }}</a> &middot; {{ h.created_at }}</small>
        </blockquote>
    {% endfor %}
    </div>
{% else %}
    <p>No highlights are available.</p>
{% endif %}

</div>
