{% load static %}

<link rel="stylesheet" href="{% static 'read/style.css' %}">
<script src="{% static 'read/dark.js' %}" defer></script>

<div class="sidebar">
    <h3>Menu</h3>
    <a href="{% url 'index' %}">To read</a>
    <a href="{% url 'archive' %}">Archive</a>
    <a href="{% url 'highlights' %}">Highlights</a>
    <a href="{% url 'feeds' %}">Feeds</a>
    <a href="{% url 'stats' %}" class="active">Stats</a>
    <a href="{% url 'trash' %}">Trash</a>

    <div class="dark-mode-toggle">
        <label class="theme-switch">
            <input type="checkbox" id="dark-mode-toggle">
            <span>Dark Mode</span>
        </label>
    </div>
</div>

<div class="content">

<h1>Stats</h1>

<div>
    <p class="stat-summary">Long-term average: <strong>{{ average|safe }}</strong> pages/day</p>

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        const data = JSON.parse('{{ data|safe }}');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Read NS',
                    data: data.values,
                    borderColor: 'rgb(123, 97, 255)',
                    backgroundColor: 'rgba(123, 97, 255, 0.08)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: 'rgb(123, 97, 255)'
                }]
            },
            options: {
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</div>

</div>
